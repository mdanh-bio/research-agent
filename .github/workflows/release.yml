name: Private release verification

# Research Agent v1 has no public or automated release channel. This manual workflow preserves a
# reproducible Mac packaging gate while updates remain private and operator-managed. It creates only
# short-lived workflow artifacts; it cannot create tags, attestations, GitHub Releases, or CDN objects.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify private Mac build
    uses: ./.github/workflows/build.yml
    with:
      mac_only: true

    # Intentionally do not inherit repository secrets. The reusable build falls back to an ad-hoc
    # signature, which is sufficient for verification and cannot publish or notarize anything.
