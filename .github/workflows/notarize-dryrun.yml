name: macOS package verification

# Manual compatibility check retained under the inherited filename. It builds ad-hoc-signed Mac
# packages and performs local signature/package smoke checks. It does not inherit secrets, contact
# Apple's notary service, or modify any GitHub Release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ad-hoc-signed Mac artifacts
    uses: ./.github/workflows/build.yml
    with:
      mac_only: true
      skip_verify: true

  verify:
    name: Verify Mac artifacts locally
    needs: build
    uses: ./.github/workflows/notarize-mac.yml
