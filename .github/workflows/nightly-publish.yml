name: Nightly artifact verification

# The inherited rolling GitHub Release publisher is intentionally disabled. An operator may use this
# read-only workflow to inspect artifacts prepared by a manually run Nightly workflow. It never
# checks out or executes code from that run, deletes tags, dispatches workflows, or publishes assets.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Nightly workflow run ID to verify
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-artifact-verification-${{ inputs.source_run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify prepared nightly artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared nightly artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          path: artifacts
          merge-multiple: true

      - name: Verify prepared nightly metadata and checksums
        run: |
          test -s artifacts/SHA256SUMS.txt
          test -s artifacts/RELEASE-CERTIFICATION.json
          (
            cd artifacts
            sha256sum --check SHA256SUMS.txt
          )
