name: Verify private CLI package

# Research Agent's SDK/CLI package is an app-internal distribution artifact. This workflow may pack
# and inspect it, but it has no npm credentials, trusted-publishing permission, tag trigger, or
# publish step.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/open-science/**'
      - 'scripts/validate-npm-release.*'
      - '.github/workflows/publish-npm.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - 'packages/open-science/**'
      - 'scripts/validate-npm-release.*'
      - '.github/workflows/publish-npm.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: verify-private-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify private Research Agent CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Verify package remains private
        run: node scripts/validate-npm-release.mjs

      - name: Test private-package guard
        run: npm run test:private-package

      - name: Test CLI and SDK
        run: npm run test:cli

      - name: Check package contents
        run: npm run check:cli-package

      - name: Build inspection tarball
        run: |
          mkdir -p npm-package
          npm pack ./packages/open-science \
            --ignore-scripts \
            --pack-destination npm-package \
            --cache ./node_modules/.cache/npm-pack

      - name: Upload inspection tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: research-agent-private-cli
          path: npm-package/*.tgz
          if-no-files-found: error
          retention-days: 5
