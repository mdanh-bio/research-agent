name: Website mirror compatibility verification

# The inherited website/CDN publisher is intentionally inert in this private fork. Keep this manual
# check only to exercise the legacy manifest/feed transforms against their fixtures. It receives no
# cloud credentials, downloads no Release assets, and uploads nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-mirror-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify legacy release transforms locally
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test manifest and feed transforms
        run: >-
          npx vitest run
          scripts/generate-version-manifest.test.ts
          scripts/inject-feed-notes.test.ts
