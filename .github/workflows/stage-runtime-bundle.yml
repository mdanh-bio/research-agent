name: Runtime bundle verification

# Build the Apple-Silicon runtime bundle on demand and retain it only as a short-lived workflow
# artifact for inspection. The inherited S3/CDN publisher is disabled: this workflow has no cloud
# credentials or upload command and cannot update the runtime used by an installed application.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Runtime bundle version to verify
        required: true
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-bundle-verification-${{ github.repository }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify osx-arm64 runtime bundle
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fetch pinned Apple-Silicon micromamba
        shell: bash
        run: |
          bin="$RUNNER_TEMP/micromamba"
          export MICROMAMBA_VERSION=$(node -p "require('./scripts/micromamba-versions.json').version")
          echo "using pinned micromamba $MICROMAMBA_VERSION"
          node scripts/fetch-micromamba.mjs osx-arm64 "$bin"
          echo "MICROMAMBA_BIN=$bin" >> "$GITHUB_ENV"

      - name: Stage default environments
        env:
          OS_STAGE_PLATFORM: osx-arm64
        run: npm run stage-default-envs

      - name: Verify bundle and requested version
        id: version
        shell: bash
        run: |
          shopt -s nullglob
          test -f resources/default-envs/manifest.json
          archives=(resources/default-envs/*.tar.zst)
          [ "${#archives[@]}" -gt 0 ]

          requested='${{ inputs.version }}'
          current=$(node -e "const s=require('fs').readFileSync('src/main/notebook/runtime-paths.ts','utf8');process.stdout.write(String(s.match(/DEFAULT_ENV_VERSION\s*=\s*(\d+)/)[1]))")
          if ! [[ "$requested" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version must be a positive integer"
            exit 1
          fi
          if [ "$requested" != "$current" ]; then
            echo "::error::requested version $requested does not match DEFAULT_ENV_VERSION $current"
            exit 1
          fi
          echo "value=$requested" >> "$GITHUB_OUTPUT"

          (
            cd resources/default-envs
            shasum -a 256 manifest.json *.tar.zst > SHA256SUMS.txt
            shasum -a 256 --check SHA256SUMS.txt
          )

      - name: Retain verification bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-bundle-osx-arm64-v${{ steps.version.outputs.value }}-verification
          path: |
            resources/default-envs/manifest.json
            resources/default-envs/*.tar.zst
            resources/default-envs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
