name: macOS signing artifact verification

# Reusable local verification for Mac build artifacts. The inherited Apple notarization and GitHub
# Release repair paths are intentionally disabled in this private fork. This workflow receives no
# signing/notary secrets, performs no external submission, and retains only short-lived run artifacts.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.arch }} Mac package locally
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    steps:
      - name: Checkout package-smoke tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Mac artifact from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-${{ matrix.arch }}
          path: mac

      - name: Verify package structure and local signature
        run: node scripts/macos-package-smoke.mjs --artifact-dir mac

      - name: Record verification checksums
        run: |
          shopt -s nullglob
          artifacts=(mac/*.dmg mac/*.zip)
          [ "${#artifacts[@]}" -gt 0 ]
          shasum -a 256 "${artifacts[@]}" > mac/VERIFICATION-SHA256SUMS.txt
          shasum -a 256 --check mac/VERIFICATION-SHA256SUMS.txt

      - name: Retain verified Mac artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-macos-${{ matrix.arch }}
          retention-days: 1
          path: |
            mac/*.dmg
            mac/*.zip
            mac/VERIFICATION-SHA256SUMS.txt
          if-no-files-found: error
